name: Publish Pages

on:
  workflow_dispatch:
    inputs:
      accepted_commit:
        description: Exact accepted data commit to publish
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish exact accepted commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: data-publisher
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.accepted_commit }}
          persist-credentials: false
      - name: Verify exact accepted commit
        env:
          EXPECTED_COMMIT: ${{ inputs.accepted_commit }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$EXPECTED_COMMIT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Create publication manifest
        run: |
          set -euo pipefail
          test -d data
          rm -rf site
          go run ./cmd/factory --build-site --data-root data --site-root site
          go run ./cmd/factory \
            --publication-manifest \
            --accepted-commit "${{ inputs.accepted_commit }}" \
            --producer-run "$GITHUB_RUN_ID" \
            --publication-manifest-out site/publication.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5