name: factory-projection

on:
  schedule:
    - cron: '*/5 * * * *'

permissions: {}

concurrency:
  group: avm-intelligence-factory-projection
  cancel-in-progress: false

jobs:
  project:
    name: Poll and reconcile due module projections
    if: ${{ false }} # Enable only through the WP-41/HUMAN-002 activation gate.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: data-publisher
    permissions:
      contents: read
      actions: read
    env:
      AVM_WRITER_APP_ID: ${{ secrets.AVM_WRITER_APP_ID }}
      AVM_WRITER_PRIVATE_KEY: ${{ secrets.AVM_WRITER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Mint state-only installation token
        id: state-token
        run: |
          set -euo pipefail
          token="$(go run ./cmd/factory --mint-state-token)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Check out immutable factory state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: factory-state
          token: ${{ steps.state-token.outputs.token }}
          path: work/state
          fetch-depth: 1
          persist-credentials: false
      - name: Verify state checkout repository identity
        env:
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          remote="$(git -C work/state remote get-url origin)"
          if [[ "$remote" != "https://github.com/${GITHUB_REPOSITORY}" && "$remote" != "https://github.com/${GITHUB_REPOSITORY}.git" ]]; then
            echo "State checkout repository identity mismatch." >&2
            exit 1
          fi
      - name: Reconcile expired projection owners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owners="$(go run ./cmd/factory --list-projection-recovery-candidates --state-branch factory-state --state-checkout-root work/state)"
          report_skip() {
            go run ./cmd/factory --projection-owner-skip "$owner" --projection-owner-skip-reason "$1"
          }
          while IFS= read -r owner; do
            run_id="$(jq -r '.run_id' <<< "$owner")"
            run_attempt="$(jq -r '.run_attempt' <<< "$owner")"
            if ! attempt="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}" 2>/dev/null)"; then
              report_skip attempt_lookup_failed
              continue
            fi
            status="$(jq -r '.status // ""' <<< "$attempt")"
            if [[ "$status" != "completed" ]]; then
              report_skip attempt_active
              continue
            fi
            if ! run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" 2>/dev/null)"; then
              report_skip run_lookup_failed
              continue
            fi
            current_status="$(jq -r '.status // ""' <<< "$run")"
            if [[ "$current_status" != "completed" ]]; then
              report_skip newer_run_active
              continue
            fi
            observation="$(jq -cn --arg repository "$GITHUB_REPOSITORY" --argjson attempt "$attempt" --argjson run "$run" '{repository: $repository, path: ($attempt.path | split("@")[0]), head_branch: $attempt.head_branch, id: $attempt.id, run_attempt: $attempt.run_attempt, status: $attempt.status, conclusion: $attempt.conclusion, current_run_attempt: $run.run_attempt, current_run_status: $run.status}')"
            if ! go run ./cmd/factory --recover-projection-owner "$owner" --actions-observation "$observation" --state-branch factory-state --state-checkout-root work/state; then
              report_skip recovery_fenced
              continue
            fi
          done < <(jq -c '.[]' <<< "$owners")
      - name: Project fresh due state intents
        run: >-
          go run ./cmd/factory
          --project-due-intents
          --state-branch factory-state
          --state-checkout-root work/state
          --project-max-modules 50
          --project-owner-run-id "${GITHUB_RUN_ID}"
          --project-owner-run-attempt "${GITHUB_RUN_ATTEMPT}"
          --project-discovery-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          --project-discovery-run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
