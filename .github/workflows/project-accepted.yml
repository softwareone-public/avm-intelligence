name: Project accepted fleet data

on:
  workflow_dispatch:

permissions: {}

jobs:
  project:
    name: Project accepted modules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: data-publisher
    permissions:
      contents: read
      actions: read
    env:
      APP_ID: ${{ secrets.AVM_WRITER_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AVM_WRITER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Project accepted modules
        run: >-
          go run ./cmd/factory
          --project-accepted
          --data-root data
          --project-accepted-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"