name: manual-discovery

on:
  workflow_dispatch:
    inputs:
      res:
        description: Resource modules (RES)
        required: false
        type: boolean
        default: true
      ptn:
        description: Pattern modules (PTN)
        required: false
        type: boolean
        default: true
      utl:
        description: Utility modules (UTL)
        required: false
        type: boolean
        default: true
      force:
        description: Queue source reprocessing even when unchanged
        required: false
        type: boolean
        default: false
      module_names:
        description: Comma-separated canonical AVM module IDs; overrides checkboxes, empty selects checked types
        required: false
        type: string
        default: ""
      continuation_id:
        description: Exact discovery-cycle ID from a deferred run; resumes its stored scope
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: avm-intelligence-v2-discovery
  cancel-in-progress: false

jobs:
  persist:
    name: Persist catalog discovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: data-publisher
    permissions:
      contents: read
    env:
      AVM_WRITER_APP_ID: ${{ secrets.AVM_WRITER_APP_ID }}
      AVM_WRITER_PRIVATE_KEY: ${{ secrets.AVM_WRITER_PRIVATE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      RES: ${{ inputs.res }}
      PTN: ${{ inputs.ptn }}
      UTL: ${{ inputs.utl }}
      FORCE: ${{ inputs.force }}
      MODULE_NAMES: ${{ inputs.module_names }}
      CONTINUATION_ID: ${{ inputs.continuation_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate manual module selection
        id: scope
        run: |
          set -euo pipefail
          if [[ -n "$CONTINUATION_ID" ]]; then
            if [[ ! "$CONTINUATION_ID" =~ ^discovery-cycle-[0-9a-f]{64}$ ]]; then
              echo "Invalid discovery continuation ID." >&2
              exit 1
            fi
            if [[ -n "${MODULE_NAMES//[[:space:]]/}" || "$FORCE" == true ]]; then
              echo "Continuation uses its durable scope; do not supply module names or force." >&2
              exit 1
            fi
            printf 'module_types=res,ptn,utl\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${MODULE_NAMES//[[:space:]]/}" ]]; then
            printf 'module_types=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          module_types=()
          if [[ "$RES" == true ]]; then module_types+=(res); fi
          if [[ "$PTN" == true ]]; then module_types+=(ptn); fi
          if [[ "$UTL" == true ]]; then module_types+=(utl); fi
          if [[ "${#module_types[@]}" -eq 0 ]]; then
            echo "Provide module names or select at least one AVM module type." >&2
            exit 1
          fi
          module_types_csv="$(IFS=,; printf '%s' "${module_types[*]}")"
          printf 'module_types=%s\n' "$module_types_csv" >> "$GITHUB_OUTPUT"
      - name: Mint state-only installation token
        id: state-token
        run: |
          set -euo pipefail
          token="$(go run ./cmd/factory --mint-state-token)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Load immutable state objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: factory-state
          token: ${{ steps.state-token.outputs.token }}
          path: work/state
          fetch-depth: 1
          persist-credentials: false
      - name: Verify state transport identity
        env:
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          remote="$(git -C work/state remote get-url origin)"
          if [[ "$remote" != "https://github.com/${GITHUB_REPOSITORY}" && "$remote" != "https://github.com/${GITHUB_REPOSITORY}.git" ]]; then
            echo "State checkout repository identity mismatch." >&2
            exit 1
          fi
          git -C work/state ls-tree -r -z HEAD > work/state-tree
      - name: Discover and validate official catalogs
        if: inputs.continuation_id == ''
        run: |
          set -euo pipefail
          mkdir -p work/v2
          go run ./cmd/factory --discover-catalog --catalog-out work/v2/candidate.json
      - name: Complete selected module discovery cycles
        env:
          FACTORY_STATE_TOKEN: ${{ steps.state-token.outputs.token }}
          MODULE_TYPES: ${{ steps.scope.outputs.module_types }}
        run: >-
          go run ./cmd/factory
          --persist-discovery work/v2/candidate.json
          --discovery-module-cycle
          --discovery-paced
          --discovery-continuation "$CONTINUATION_ID"
          --state-layout-config config/layout.yaml
          --state-checkout-root work/state
          --state-checkout-tree work/state-tree
          --state-branch factory-state
          --extractor-contract factory-hcl-v1
          --extractor-capabilities native-hcl-v1,terraform-json-v1
          --module-types "$MODULE_TYPES"
          --module-names "$MODULE_NAMES"
          --force="$FORCE"
          --discovery-result-out work/v2/discovery-result.json
          --project-discovery-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          --project-discovery-run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Report durable continuation
        if: always()
        run: |
          set -euo pipefail
          if [[ -f work/v2/discovery-result.json ]]; then
            jq -r 'if .deferred == true then "Discovery deferred. Continuation: `" + .continuation_id + "`. Retry after: `" + .retry_at + "`. Completed: " + ((.completed_module_ids // []) | length | tostring) elif .continuation_complete == true then "Discovery completed for the selected scope." else "Discovery stopped. Continuation: `" + (.continuation_id // "unavailable") + "`. Durable: " + ((.continuation_durable // false) | tostring) end' work/v2/discovery-result.json >> "$GITHUB_STEP_SUMMARY"
          fi