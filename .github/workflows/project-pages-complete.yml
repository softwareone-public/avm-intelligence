name: Project Pages completion

on:
  workflow_run:
    workflows: [Publish Pages]
    types: [completed]

permissions: {}

jobs:
  project:
    name: Mark accepted modules Done
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: data-publisher
    permissions:
      contents: read
      actions: read
    env:
      APP_ID: ${{ secrets.AVM_WRITER_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AVM_WRITER_PRIVATE_KEY }}
      DEPLOYMENT_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Download deployment receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/publication-receipt
          gh run download "$DEPLOYMENT_RUN_ID" \
            --name "publication-receipt-${DEPLOYMENT_RUN_ID}" \
            --dir work/publication-receipt
          receipt="work/publication-receipt/publication.json"
          test -s "$receipt"
          producer_run="$(jq -er '.producer_run' "$receipt")"
          test "$producer_run" = "$DEPLOYMENT_RUN_ID"
          accepted_commit="$(jq -er '.accepted_commit | select(test("^[0-9a-f]{40}$"))' "$receipt")"
          echo "accepted_commit=$accepted_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.receipt.outputs.accepted_commit }}
          path: work/accepted-source
          persist-credentials: false
      - name: Verify checked-out accepted commit
        env:
          EXPECTED_COMMIT: ${{ steps.receipt.outputs.accepted_commit }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C work/accepted-source rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Project Pages-complete modules
        run: >-
          go run ./cmd/factory
          --project-accepted
          --data-root work/accepted-source/data
          --project-accepted-status Done
          --publication-receipt work/publication-receipt/publication.json
          --deployment-run-id "$DEPLOYMENT_RUN_ID"
          --project-accepted-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"