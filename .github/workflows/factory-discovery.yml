name: factory-discovery

on:
  schedule:
    - cron: "17 3 * * *"

permissions: {}

concurrency:
  group: avm-intelligence-v2-discovery
  cancel-in-progress: false

jobs:
  persist:
    name: Persist catalog discovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: data-publisher
    permissions:
      contents: read
    env:
      AVM_WRITER_APP_ID: ${{ secrets.AVM_WRITER_APP_ID }}
      AVM_WRITER_PRIVATE_KEY: ${{ secrets.AVM_WRITER_PRIVATE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Mint state-only installation token
        id: state-token
        run: |
          set -euo pipefail
          token="$(go run ./cmd/factory --mint-state-token)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Discover and validate official catalogs
        run: |
          set -euo pipefail
          mkdir -p work/v2
          go run ./cmd/factory --discover-catalog --catalog-out work/v2/candidate.json
      - name: Check out immutable factory state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: factory-state
          token: ${{ steps.state-token.outputs.token }}
          path: work/state
          fetch-depth: 1
          persist-credentials: false
      - name: Verify state checkout repository identity
        env:
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          remote="$(git -C work/state remote get-url origin)"
          if [[ "$remote" != "https://github.com/${GITHUB_REPOSITORY}" && "$remote" != "https://github.com/${GITHUB_REPOSITORY}.git" ]]; then
            echo "State checkout repository identity mismatch." >&2
            exit 1
          fi
      - name: Persist discovery transaction
        run: >-
          go run ./cmd/factory
          --persist-discovery work/v2/candidate.json
          --discovery-new-modules-only
          --state-checkout-root work/state
          --state-branch factory-state
          --extractor-contract factory-hcl-v1
          --extractor-capabilities native-hcl-v1,terraform-json-v1
          --discovery-result-out work/v2/discovery-result.json
      - name: Project newly discovered lifecycle intents
        run: |
          set -euo pipefail
          module_ids="$(jq -er '.projection_module_ids // [] | join(",")' work/v2/discovery-result.json)"
          if [[ -z "${module_ids//[[:space:],]/}" ]]; then
            echo "No newly discovered modules need a lifecycle projection." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go run ./cmd/factory \
            --project-discovery-modules "$module_ids" \
            --project-discovery-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --project-discovery-run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --state-checkout-root work/state \
            --state-branch factory-state
