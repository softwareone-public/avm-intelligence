name: V2 proposal validation
run-name: Validate typed proposal for ${{ github.event.pull_request.number || github.sha }}

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions: {}

concurrency:
  group: avm-v2-proposal-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate proposal against current base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Pin trusted checkout to event base commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$(jq -er '.merge_group.base_sha' "$GITHUB_EVENT_PATH")"
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$BASE_SHA"
          git reset --hard "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fetch candidate commit as data only
        id: fetch-candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            [[ "$PULL_REQUEST_NUMBER" =~ ^[0-9]+$ ]]
            candidate_ref="refs/pull/${PULL_REQUEST_NUMBER}/merge"
          else
            candidate_ref="$EVENT_REF"
            case "$candidate_ref" in
              refs/heads/gh-readonly-queue/*) ;;
              *) echo "Unexpected merge-group ref" >&2; exit 1 ;;
            esac
          fi
          git fetch --no-tags origin "$candidate_ref"
          CANDIDATE_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          git diff --no-renames --name-only -z "$BASE_SHA" "$CANDIDATE_SHA" > "$RUNNER_TEMP/proposal-changed-paths"
          has_proposal_change=false
          while IFS= read -r -d '' path; do
            case "$path" in
              proposal.json|data/*) has_proposal_change=true ;;
            esac
          done < "$RUNNER_TEMP/proposal-changed-paths"
          echo "has_proposal_change=$has_proposal_change" >> "$GITHUB_OUTPUT"
          if [[ "$has_proposal_change" != true ]]; then
            echo 'No typed proposal paths changed; validation is not applicable.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          proposal_root="$RUNNER_TEMP/proposal-input"
          mkdir -p "$proposal_root"
          git cat-file -e "$CANDIDATE_SHA:proposal.json"
          proposal_base="$(git show "$CANDIDATE_SHA:proposal.json" | jq -er '.expected_base')"
          [[ "$proposal_base" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$proposal_base" "$BASE_SHA"
          while IFS= read -r -d '' path; do
            case "$path" in
              proposal.json)
                destination="$proposal_root/proposal.json"
                ;;
              data/*)
                relative_path="${path#data/}"
                case "$relative_path" in
                  ""|..|../*|*/../*|*/..|*\\*) echo "Unsafe candidate data path" >&2; exit 1 ;;
                esac
                destination="$proposal_root/$path"
                ;;
              *) echo "Proposal PR changes a non-data file: $path" >&2; exit 1 ;;
            esac
            tree_entry="$(git ls-tree -z "$CANDIDATE_SHA" -- "$path")"
            if [[ -z "$tree_entry" ]]; then
              if [[ "$path" == "proposal.json" ]]; then
                echo "Candidate proposal envelope is missing" >&2
                exit 1
              fi
              continue
            fi
            metadata="${tree_entry%%$'\t'*}"
            mode="${metadata%% *}"
            if [[ "$mode" != "100644" ]]; then
              echo "Proposal payload must be a regular non-executable file: $path (mode $mode)" >&2
              exit 1
            fi
            if git cat-file -e "$CANDIDATE_SHA:$path" 2>/dev/null; then
              mkdir -p "$(dirname "$destination")"
              git show "$CANDIDATE_SHA:$path" > "$destination"
            elif [[ "$path" == "proposal.json" ]]; then
              echo "Candidate proposal envelope is missing" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/proposal-changed-paths"
      - name: Validate and rebuild the proposal candidate
        if: ${{ steps.fetch-candidate.outputs.has_proposal_change == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/factory \
            --apply-proposal \
            --proposal-root "$RUNNER_TEMP/proposal-input" \
            --proposal-base "$BASE_SHA" \
            --accepted-data-base data \
            --proposal-data-out "$RUNNER_TEMP/accepted-candidate" \
            --proposal-changed-paths "$RUNNER_TEMP/proposal-changed-paths"
          accepted_root="$RUNNER_TEMP/accepted-candidate"
          comparison_file="$RUNNER_TEMP/proposal-candidate-file"
          while IFS= read -r -d '' accepted_file; do
            relative_path="${accepted_file#"$accepted_root"/}"
            candidate_path="data/$relative_path"
            git cat-file -e "$CANDIDATE_SHA:$candidate_path"
            git show "$CANDIDATE_SHA:$candidate_path" > "$comparison_file"
            cmp -s "$accepted_file" "$comparison_file"
          done < <(find "$accepted_root" -type f -print0)
          while IFS= read -r -d '' changed_path; do
            if [[ "$changed_path" == data/* ]] && ! git cat-file -e "$CANDIDATE_SHA:$changed_path" 2>/dev/null; then
              relative_path="${changed_path#data/}"
              test ! -e "$accepted_root/$relative_path"
            fi
          done < "$RUNNER_TEMP/proposal-changed-paths"