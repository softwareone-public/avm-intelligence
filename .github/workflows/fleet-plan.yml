name: Fleet plan

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      dispatch:
        description: Run analysis workers after planning
        required: true
        default: false
        type: boolean
      resource_modules:
        description: Include resource modules
        required: true
        default: true
        type: boolean
      pattern_modules:
        description: Include pattern modules
        required: true
        default: true
        type: boolean
      utility_modules:
        description: Include utility modules
        required: true
        default: true
        type: boolean
      module_ids:
        description: Optional comma-separated module IDs for a fast targeted run
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  plan:
    name: Discover and plan fleet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      WORK: work/fleet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Seed prior accepted inputs
        run: |
          set -euo pipefail
          mkdir -p "$WORK/requests" "$WORK/previous-sources"
          if [[ -f data/discovery.json ]]; then
            cp data/discovery.json "$WORK/discovery.json"
          fi
          if [[ -d data/requests ]]; then
            rsync --archive data/requests/ "$WORK/requests/"
          fi
          if [[ -d data/source-pins ]]; then
            rsync --archive data/source-pins/ "$WORK/previous-sources/"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Discover official catalogs
        run: go run ./cmd/factory --discover-catalog --catalog-out "$WORK/candidate.json"
      - name: Accept discovery into the run workspace
        run: go run ./cmd/factory --accept-catalog "$WORK/candidate.json" --catalog-state "$WORK/discovery.json"
      - name: Resolve immutable fleet sources
        id: resolve
        env:
          RUN_RESOURCES: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_modules }}
          RUN_PATTERNS: ${{ github.event_name != 'workflow_dispatch' || inputs.pattern_modules }}
          RUN_UTILITIES: ${{ github.event_name != 'workflow_dispatch' || inputs.utility_modules }}
          MODULE_IDS: ${{ inputs.module_ids || '' }}
        run: |
          set -euo pipefail
          module_types=()
          [[ "$RUN_RESOURCES" == true ]] && module_types+=(res)
          [[ "$RUN_PATTERNS" == true ]] && module_types+=(ptn)
          [[ "$RUN_UTILITIES" == true ]] && module_types+=(utl)
          test "${#module_types[@]}" -gt 0
          module_types_value="$(IFS=,; echo "${module_types[*]}")"
          echo "module_types=$module_types_value" >> "$GITHUB_OUTPUT"
          go run ./cmd/factory --resolve-fleet --previous-sources "$WORK/previous-sources" --module-types "$module_types_value" --module-ids "$MODULE_IDS" --catalog-state "$WORK/discovery.json" --fleet-sources-out "$WORK/resolved-sources.json"
      - name: Build dry-run fleet plan
        env:
          MODULE_TYPES: ${{ steps.resolve.outputs.module_types }}
          MODULE_IDS: ${{ inputs.module_ids || '' }}
        run: >-
          go run ./cmd/factory
          --plan-fleet
          --catalog-state "$WORK/discovery.json"
          --resolved-sources "$WORK/resolved-sources.json"
          --module-types "$MODULE_TYPES"
          --module-ids "$MODULE_IDS"
          --requests-dir "$WORK/requests"
          --fleet-plan-out "$WORK/fleet-plan.json"
      - name: Prepare worker matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(jq -c '([.batches[].module_ids[]]) as $ids | {include: [.items[] | select((.module_id as $id | ($ids | index($id))) != null) | {module_id, fingerprint, source_sha, source_version}]}' "$WORK/fleet-plan.json")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Summarize plan
        run: |
          set -euo pipefail
          jq -r '"catalog generation: \(.catalog_generation)", "items: \(.items | length)", "dispatch batches: \(.batches | length)", "dispatch modules: \([.batches[].module_ids[]] | length)"' "$WORK/fleet-plan.json" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.dispatch }}" != "true" ]]; then
            echo 'Worker dispatch is disabled; use workflow_dispatch with dispatch=true after reviewing this plan.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-plan-${{ github.run_id }}
          path: work/fleet
          retention-days: 30

  project:
    name: Project fleet work
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: data-publisher
    permissions:
      contents: read
      actions: read
    env:
      APP_ID: ${{ secrets.AVM_WRITER_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AVM_WRITER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          name: fleet-plan-${{ github.run_id }}
          path: work/fleet
      - name: Reconcile module Issues and Project items
        run: >-
          go run ./cmd/factory
          --project-fleet
          --project-fleet-plan work/fleet/fleet-plan.json
          --project-fleet-state work/fleet/discovery.json
          --project-fleet-sources work/fleet/resolved-sources.json
          --project-fleet-requests work/fleet/requests
          --project-fleet-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  assemble:
    name: Assemble accepted candidate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch && needs.worker.result == 'success' }}
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          name: fleet-plan-${{ github.run_id }}
          path: work/fleet
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          pattern: fleet-analysis-*
          path: work/fleet/artifacts
          merge-multiple: false
      - name: Overlay accepted worker requests
        run: |
          set -euo pipefail
          mkdir -p work/accepted-requests
          rsync --archive work/fleet/requests/ work/accepted-requests/
          find work/fleet/artifacts -path '*/requests/*.json' -type f -exec cp {} work/accepted-requests/ \;
      - name: Assemble candidate data
        run: >-
          go run ./cmd/factory
          --assemble-candidate
          --fleet-plan-input work/fleet/fleet-plan.json
          --worker-artifacts work/fleet/artifacts
          --candidate-data-out work/candidate-data
      - name: Accept candidate bundle
        run: >-
          go run ./cmd/factory
          --accept-candidate
          --candidate-data-out work/candidate-data
          --accepted-discovery work/fleet/discovery.json
          --accepted-requests work/accepted-requests
          --accepted-data-base data
          --accepted-data-out work/accepted-data
      - name: Retain resolved source-pin history
        run: |
          set -euo pipefail
          mkdir -p work/accepted-data/source-pins
          while IFS= read -r pin; do
            module_id="$(jq -r '.module_id' <<< "$pin")"
            [[ "$module_id" =~ ^avm-(res|ptn|utl)-[a-z0-9]+(-[a-z0-9]+)*$ ]]
            printf '%s\n' "$pin" > "work/accepted-data/source-pins/${module_id}.json"
          done < <(jq -c '.[]' work/fleet/resolved-sources.json)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-accepted-bundle-${{ github.run_id }}
          path: work/accepted-data
          retention-days: 7

  accept:
    name: Commit accepted data
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch && needs.assemble.result == 'success' }}
    needs: assemble
    outputs:
      accepted_commit: ${{ steps.commit.outputs.accepted_commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: data-publisher
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - name: Verify current main has not moved
        env:
          EXPECTED_BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual_base="$(git rev-parse origin/main)"
          test "$actual_base" = "$EXPECTED_BASE"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          name: fleet-accepted-bundle-${{ github.run_id }}
          path: work/accepted-data
      - name: Install accepted bundle
        run: |
          set -euo pipefail
          mkdir -p data
          rsync --archive --delete work/accepted-data/ data/
          git add -- data
          unexpected="$(git diff --cached --name-only | awk '$0 !~ /^data\// {print}')"
          test -z "$unexpected"
      - name: Commit accepted data and open pull request
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            accepted_commit="$(git rev-parse HEAD)"
            echo 'No accepted data changes; canonical commit is unchanged.' >> "$GITHUB_STEP_SUMMARY"
            echo "accepted_commit=$accepted_commit" >> "$GITHUB_OUTPUT"
          else
            branch="factory/data-${GITHUB_RUN_ID}"
            git switch --create "$branch"
            git -c user.name=factory -c user.email=factory@example.invalid commit -m "data: accept fleet analysis"
            git push --no-verify --set-upstream origin "$branch"
            pr_url="$(gh pr create --base main --head "$branch" --title "data: accept fleet analysis" --body "Automated accepted fleet bundle from workflow run ${GITHUB_RUN_ID}. Review the generated data before merging.")"
            echo "accepted_commit=" >> "$GITHUB_OUTPUT"
            echo "accepted data pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "${accepted_commit:-}" ]]; then
            printf '%s\n' "$accepted_commit" | tee work/accepted-commit.txt
            echo "accepted commit: $accepted_commit" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-commit-${{ github.run_id }}
          path: work/accepted-commit.txt
          if-no-files-found: ignore
          retention-days: 30

  pages:
    name: Deploy accepted Pages commit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch && needs.accept.result == 'success' && needs.accept.outputs.accepted_commit != '' }}
    needs: accept
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pages-publisher
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.accept.outputs.accepted_commit }}
          persist-credentials: false
      - name: Verify accepted commit
        env:
          EXPECTED_COMMIT: ${{ needs.accept.outputs.accepted_commit }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build exact accepted site
        env:
          EXPECTED_COMMIT: ${{ needs.accept.outputs.accepted_commit }}
        run: |
          set -euo pipefail
          test -d data
          rm -rf site
          go run ./cmd/factory --build-site --data-root data --site-root site
          go run ./cmd/factory \
            --publication-manifest \
            --accepted-commit "$EXPECTED_COMMIT" \
            --producer-run "$GITHUB_RUN_ID" \
            --publication-manifest-out site/publication.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Record deployment
        run: echo "deployed accepted commit $EXPECTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"

  worker:
    name: Analyze ${{ matrix.module_id }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      WORK: work/fleet
      MODULE_ID: ${{ matrix.module_id }}
      FINGERPRINT: ${{ matrix.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          name: fleet-plan-${{ github.run_id }}
          path: work/fleet
      - name: Download and verify pinned IaCLens
        run: |
          set -euo pipefail
          archive=iaclens_0.1.0_linux_amd64.tar.gz
          curl --fail --location --output "$archive" \
            "https://github.com/Ledermayer/iaclens/releases/download/v0.1.0/$archive"
          echo "390ef9d188341c85d42e16adf61cbf6b91effeee9ec0af99c492ab50b08d6238  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive"
          ./iaclens --version
      - name: Prepare immutable module source
        run: |
          set -euo pipefail
          archive_url="$(jq -r --arg id "$MODULE_ID" '.[] | select(.module_id == $id) | .archive_url' "$WORK/resolved-sources.json")"
          test -n "$archive_url" -a "$archive_url" != null
          curl --fail --location --output source.tar.gz "$archive_url"
          mkdir source
          tar --extract --gzip --no-same-owner --no-same-permissions --file source.tar.gz --directory source --strip-components=1
          git -C source init --quiet
          git -C source config core.hooksPath /dev/null
          git -C source add --all
          git -C source -c user.name=factory -c user.email=factory@example.invalid commit --quiet --no-verify -m "Pinned module source"
          mkdir -p "$WORK/attempt"
      - name: Analyze and finish durable request
        run: >-
          go run ./cmd/factory
          --analyze-request
          --module-id "$MODULE_ID"
          --fingerprint "$FINGERPRINT"
          --run-id "$GITHUB_RUN_ID"
          --requests-dir "$WORK/requests"
          --iaclens "$PWD/iaclens"
          --source "$PWD/source"
          --config config/iaclens.yaml
          --work "$WORK/attempt"
          --analysis-out "$WORK/analysis.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: fleet-analysis-${{ matrix.module_id }}
          path: |
            work/fleet/analysis.json
            work/fleet/attempt/report.raw.json
            work/fleet/requests/${{ matrix.module_id }}.json
          if-no-files-found: ignore
          retention-days: 2