schema_version: 1
providers:
  - address: registry.terraform.io/hashicorp/azurerm
    source_repository: hashicorp/terraform-provider-azurerm
    source_license: MPL-2.0
    track_majors: [4, 5]
    collection_kinds: [action, datasource, ephemeral, function, resource]
    limits:
      max_releases: 10
      max_pages: 10
      max_response_bytes: 1048576
      max_total_bytes: 10485760
      max_wall_time_seconds: 900
  - address: registry.terraform.io/Azure/azapi
    source_repository: Azure/terraform-provider-azapi
    source_license: MPL-2.0
    track_majors: []
    collection_kinds: [action, datasource, ephemeral, function, resource]
    limits:
      max_releases: 10
      max_pages: 10
      max_response_bytes: 1048576
      max_total_bytes: 10485760
      max_wall_time_seconds: 900